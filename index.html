<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Physics Arena - Molecular Edition</title>
<style>
  :root{
    --bg-top:#161a2c;
    --bg-bottom:#080a12;
    --panel:#0e1120cc;
    --text:#eef0fa;
    --muted:#9aa0c0;
    --accent:#ffcd3c;
    --accent2:#5ad2ff;
    --danger:#ff6a5c;
  }
  *{box-sizing:border-box;}
  html, body{
    margin:0; padding:0;
    width:100%; height:100%;
    background:#05060b;
    color:var(--text);
    font-family:'Segoe UI',Roboto,Arial,sans-serif;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    overflow:hidden;
    touch-action:none;
    user-select:none;
    -webkit-user-select:none;
  }
  .stage{
    position:relative;
    width:100%; height:100%;
    max-width:1280px; max-height:800px;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    padding:8px;
    gap:8px;
  }
  h1{
    margin:0;
    font-size:clamp(1rem, 2.5vw, 1.4rem);
    font-weight:700;
    letter-spacing:.3px;
    background:linear-gradient(90deg,var(--accent2),var(--accent));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    text-align:center;
  }
  .frame{
    position:relative;
    width:100%;
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:12px;
    box-shadow:0 20px 60px rgba(0,0,0,.55), 0 0 0 1px #ffffff12 inset;
    overflow:hidden;
    background:radial-gradient(ellipse at 30% 0%, var(--bg-top), var(--bg-bottom) 75%);
  }
  canvas{
    display:block;
    max-width:100%;
    max-height:100%;
    aspect-ratio: 16 / 10;
    touch-action:none;
    cursor:crosshair;
  }
  .hud{
    position:absolute;
    top:10px; left:10px; right:10px;
    display:flex; justify-content:space-between;
    pointer-events:none;
    font-variant-numeric:tabular-nums;
    gap:6px;
  }
  .pill{
    background:var(--panel);
    border:1px solid #ffffff18;
    border-radius:999px;
    padding:4px 10px;
    font-size:clamp(0.7rem, 2vw, 0.82rem);
    color:var(--muted);
    backdrop-filter:blur(6px);
  }
  .pill b{color:var(--text);font-weight:700;}
  .score{
    font-size:clamp(0.85rem, 2.5vw, 1.15rem);
    font-weight:800;
    color:var(--accent);
  }
  .footer{
    display:flex; gap:12px; flex-wrap:wrap; justify-content:center;
    font-size:clamp(0.65rem, 1.8vw, 0.78rem); color:var(--muted);
    text-align:center;
  }
  .footer kbd{
    background:#ffffff14;
    border:1px solid #ffffff22;
    border-radius:5px;
    padding:1px 5px;
    font-family:inherit;
    color:var(--text);
  }
  .win-banner{
    position:absolute;
    top:50%; left:50%;
    transform:translate(-50%,-50%);
    text-align:center;
    padding:16px 24px;
    background:#000000c0;
    border:1px solid #ffffff22;
    border-radius:12px;
    font-size:clamp(1rem, 3vw, 1.2rem);
    font-weight:700;
    color:var(--accent);
    display:none;
    z-index:10;
  }
  .win-banner.show{display:block;}
  .pause-overlay{
    position:absolute; inset:0;
    background:#000000a0;
    display:none;
    align-items:center; justify-content:center;
    font-size:2rem; font-weight:800;
    letter-spacing:2px;
    color:var(--text);
    z-index:10;
  }
  .pause-overlay.show{display:flex;}
</style>
</head>
<body>

<div class="stage">
  <h1>Physics Arena - Molecular Edition</h1>

  <div class="frame">
    <canvas id="game" width="960" height="600"></canvas>
    <div class="hud">
      <div class="pill">Moléculas <b id="ballCount">0/40</b></div>
      <div class="pill score">🏆 <span id="score">0</span></div>
      <div class="pill">Alvos <b id="targetCount">0</b></div>
    </div>
    <div class="win-banner" id="winBanner">Todos os alvos destruídos!<br>Toque na tela ou pressione R</div>
    <div class="pause-overlay" id="pauseOverlay">PAUSADO</div>
  </div>

  <div class="footer">
    <span>👉 Arraste a partir do canhão para mirar e solte</span>
    <span><kbd>R</kbd> reiniciar</span>
    <span><kbd>P</kbd> pausar</span>
  </div>
</div>

<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;

  const GRAVITY = 850;
  const AIR_DRAG_K = 0.005;
  const WALL_RESTITUTION = 0.78;
  const BALL_RESTITUTION = 0.9;
  const GROUND_FRICTION = 0.985;
  const SUBSTEPS = 8;
  const MAX_DRAG = 160;
  const LAUNCH_MULT = 12.0;
  const MAX_BALLS = 40;
  const CANNON = { x: 70, y: H - 70 };

  let balls = [];
  let targets = [];
  let particles = [];
  let score = 0;
  let dragging = false;
  let paused = false;
  let mouse = { x: CANNON.x, y: CANNON.y };
  let lastTime = performance.now();

  const rand = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  function vlen(x, y) { return Math.sqrt(x * x + y * y); }

  function makeBall(x, y, vx, vy, radius, hue) {
    const atomCount = Math.floor(rand(3, 6));
    const atoms = [];
    for (let i = 0; i < atomCount; i++) {
      const angle = (Math.PI * 2 / atomCount) * i + rand(-0.2, 0.2);
      const dist = rand(0.5, 0.75);
      atoms.push({
        relAngle: angle,
        relDist: dist,
        size: rand(0.28, 0.42),
        hueOffset: rand(-30, 30)
      });
    }

    return {
      x, y, vx, vy, radius,
      mass: radius * radius * 0.05,
      hue,
      angle: rand(0, Math.PI * 2),
      rotSpeed: rand(-6, 6),
      atoms,
      trail: []
    };
  }

  function makeTarget(x, y, radius, points, hue) {
    return { x, y, radius, points, hue, alive: true, pulse: Math.random() * Math.PI * 2 };
  }

  function resetTargets() {
    targets = [];
    const hues = [4, 45, 195, 265, 140];
    const cols = 6, rows = 3;
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        if (Math.random() < 0.25) continue;
        const x = 320 + c * 95;
        const y = 90 + r * 70;
        const points = (rows - r) * 10;
        targets.push(makeTarget(x, y, 22, points, hues[(r + c) % hues.length]));
      }
    }
  }

  function resetGame() {
    balls = [];
    particles = [];
    score = 0;
    resetTargets();
  }

  function spawnBurst(x, y, hue) {
    for (let i = 0; i < 18; i++) {
      const ang = Math.random() * Math.PI * 2;
      const speed = rand(60, 240);
      particles.push({
        x, y,
        vx: Math.cos(ang) * speed,
        vy: Math.sin(ang) * speed,
        life: rand(0.5, 0.9),
        maxLife: 0,
        hue
      });
    }
    particles.forEach(p => { if (p.maxLife === 0) p.maxLife = p.life; });
  }

  function stepPhysics(dt) {
    for (const b of balls) {
      const speed = vlen(b.vx, b.vy);
      const dragF = AIR_DRAG_K * speed * speed * 0.02;
      const dvx = speed > 0 ? -(b.vx / speed) * dragF / b.mass : 0;
      const dvy = speed > 0 ? -(b.vy / speed) * dragF / b.mass : 0;
      b.vx += dvx * dt;
      b.vy += (GRAVITY + dvy) * dt;
      b.x += b.vx * dt;
      b.y += b.vy * dt;

      b.angle += b.rotSpeed * dt;
    }

    for (const b of balls) {
      if (b.x - b.radius < 0) { b.x = b.radius; b.vx = -b.vx * WALL_RESTITUTION; }
      else if (b.x + b.radius > W) { b.x = W - b.radius; b.vx = -b.vx * WALL_RESTITUTION; }

      if (b.y - b.radius < 0) { b.y = b.radius; b.vy = -b.vy * WALL_RESTITUTION; }
      else if (b.y + b.radius > H) {
        b.y = H - b.radius;
        b.vy = -b.vy * WALL_RESTITUTION;
        if (Math.abs(b.vy) < 40) b.vx *= GROUND_FRICTION;
      }
    }

    for (let i = 0; i < balls.length; i++) {
      for (let j = i + 1; j < balls.length; j++) {
        resolveBallCollision(balls[i], balls[j]);
      }
    }

    for (const b of balls) {
      for (const t of targets) {
        if (!t.alive) continue;
        const dx = b.x - t.x, dy = b.y - t.y;
        const dist = vlen(dx, dy);
        if (dist < b.radius + t.radius) {
          const speed = vlen(b.vx, b.vy);
          if (speed > 40) {
            t.alive = false;
            score += t.points;
            spawnBurst(t.x, t.y, t.hue);
          } else if (dist > 1e-6) {
            const nx = dx / dist, ny = dy / dist;
            b.x = t.x + nx * (b.radius + t.radius);
            b.y = t.y + ny * (b.radius + t.radius);
            const vAlongN = b.vx * nx + b.vy * ny;
            b.vx = (b.vx - 2 * vAlongN * nx) * 0.6;
            b.vy = (b.vy - 2 * vAlongN * ny) * 0.6;
          }
        }
      }
    }

    for (const b of balls) {
      b.trail.push({ x: b.x, y: b.y });
      if (b.trail.length > 12) b.trail.shift();
    }

    while (balls.length > MAX_BALLS) balls.shift();
  }

  function resolveBallCollision(a, b) {
    const dx = b.x - a.x, dy = b.y - a.y;
    const dist = vlen(dx, dy);
    const minDist = a.radius + b.radius;
    if (dist >= minDist || dist < 1e-6) return;

    const nx = dx / dist, ny = dy / dist;
    const overlap = minDist - dist;
    const totalMass = a.mass + b.mass;
    a.x -= nx * overlap * (b.mass / totalMass);
    a.y -= ny * overlap * (b.mass / totalMass);
    b.x += nx * overlap * (a.mass / totalMass);
    b.y += ny * overlap * (a.mass / totalMass);

    const rvx = a.vx - b.vx, rvy = a.vy - b.vy;
    const velAlongNormal = rvx * nx + rvy * ny;
    if (velAlongNormal > 0) return;

    const e = BALL_RESTITUTION;
    const j = -(1 + e) * velAlongNormal / (1 / a.mass + 1 / b.mass);
    const ix = j * nx, iy = j * ny;
    a.vx += ix / a.mass; a.vy += iy / a.mass;
    b.vx -= ix / b.mass; b.vy -= iy / b.mass;
  }

  function updateParticles(dt) {
    particles = particles.filter(p => {
      p.vy += 500 * dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.life -= dt;
      return p.life > 0;
    });
  }

  function drawGrid() {
    ctx.strokeStyle = 'rgba(255,255,255,0.04)';
    ctx.lineWidth = 1;
    for (let x = 0; x < W; x += 40) {
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
    }
    for (let y = 0; y < H; y += 40) {
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
    }
  }

  function drawTarget(t) {
    if (!t.alive) return;
    t.pulse += 0.05;
    const glow = t.radius + Math.sin(t.pulse) * 2;
    ctx.fillStyle = `hsla(${t.hue}, 90%, 60%, 0.25)`;
    ctx.beginPath();
    ctx.arc(t.x, t.y, glow + 6, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = `hsl(${t.hue}, 90%, 60%)`;
    ctx.beginPath();
    ctx.arc(t.x, t.y, t.radius, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#fff';
    ctx.font = 'bold 13px Segoe UI, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('+' + t.points, t.x, t.y + 1);
  }

  function drawBall(b) {
    for (let i = 0; i < b.trail.length; i++) {
      const alpha = (i / b.trail.length) * 0.25;
      const p = b.trail[i];
      ctx.fillStyle = `hsla(${b.hue}, 85%, 60%, ${alpha})`;
      ctx.beginPath();
      ctx.arc(p.x, p.y, b.radius * 0.5, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.save();
    ctx.translate(b.x, b.y);
    ctx.rotate(b.angle);

    ctx.strokeStyle = 'rgba(220, 230, 255, 0.65)';
    ctx.lineWidth = Math.max(2, b.radius * 0.12);
    for (const atom of b.atoms) {
      const ax = Math.cos(atom.relAngle) * (b.radius * atom.relDist);
      const ay = Math.sin(atom.relAngle) * (b.radius * atom.relDist);
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(ax, ay);
      ctx.stroke();
    }

    for (const atom of b.atoms) {
      const ax = Math.cos(atom.relAngle) * (b.radius * atom.relDist);
      const ay = Math.sin(atom.relAngle) * (b.radius * atom.relDist);
      const aRadius = b.radius * atom.size;
      const aHue = (b.hue + atom.hueOffset + 360) % 360;

      const grad = ctx.createRadialGradient(
        ax - aRadius * 0.3, ay - aRadius * 0.3, aRadius * 0.1,
        ax, ay, aRadius
      );
      grad.addColorStop(0, `hsl(${aHue}, 95%, 80%)`);
      grad.addColorStop(1, `hsl(${aHue}, 80%, 45%)`);

      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(ax, ay, aRadius, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = 'rgba(0,0,0,0.3)';
      ctx.lineWidth = 1;
      ctx.stroke();
    }

    const cRadius = b.radius * 0.42;
    const cGrad = ctx.createRadialGradient(
      -cRadius * 0.3, -cRadius * 0.3, cRadius * 0.1,
      0, 0, cRadius
    );
    cGrad.addColorStop(0, '#ffffff');
    cGrad.addColorStop(0.4, `hsl(${b.hue}, 100%, 75%)`);
    cGrad.addColorStop(1, `hsl(${b.hue}, 90%, 40%)`);

    ctx.fillStyle = cGrad;
    ctx.beginPath();
    ctx.arc(0, 0, cRadius, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.4)';
    ctx.lineWidth = 1.2;
    ctx.stroke();

    ctx.restore();
  }

  function drawParticle(p) {
    const alpha = clamp(p.life / p.maxLife, 0, 1);
    ctx.fillStyle = `hsla(${p.hue}, 90%, 65%, ${alpha})`;
    const r = 3 * alpha + 1;
    ctx.beginPath();
    ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawCannon() {
    const dx = CANNON.x - mouse.x;
    const dy = CANNON.y - mouse.y;
    
    const angle = (dragging && (Math.abs(dx) > 2 || Math.abs(dy) > 2)) 
      ? Math.atan2(dy, dx) 
      : -Math.PI / 4;

    ctx.save();
    ctx.translate(CANNON.x, CANNON.y);

    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    ctx.beginPath();
    ctx.ellipse(0, 14, 26, 8, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.save();
    ctx.rotate(angle);

    const pipeGrad = ctx.createLinearGradient(0, -11, 0, 11);
    pipeGrad.addColorStop(0, '#69738a');
    pipeGrad.addColorStop(0.3, '#3a4050');
    pipeGrad.addColorStop(0.5, '#202430');
    pipeGrad.addColorStop(0.8, '#4a5266');
    pipeGrad.addColorStop(1, '#1a1d26');

    ctx.fillStyle = pipeGrad;
    ctx.beginPath();
    ctx.roundRect(-8, -11, 52, 22, [0, 4, 4, 0]);
    ctx.fill();
    ctx.strokeStyle = '#11131a';
    ctx.lineWidth = 1.5;
    ctx.stroke();

    const muzzleGrad = ctx.createLinearGradient(44, -13, 44, 13);
    muzzleGrad.addColorStop(0, '#8b95a8');
    muzzleGrad.addColorStop(0.5, '#2a2f3d');
    muzzleGrad.addColorStop(1, '#69738a');
    ctx.fillStyle = muzzleGrad;
    ctx.fillRect(40, -13, 7, 26);
    ctx.strokeRect(40, -13, 7, 26);

    ctx.fillStyle = '#0a0b0e';
    ctx.beginPath();
    ctx.ellipse(47, 0, 2.5, 11, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#2a2e3d';
    ctx.fillRect(8, -12, 5, 24);
    ctx.fillRect(24, -12, 4, 24);

    ctx.restore();

    const baseGrad = ctx.createRadialGradient(0, 0, 4, 0, 0, 22);
    baseGrad.addColorStop(0, '#525a6e');
    baseGrad.addColorStop(0.7, '#252936');
    baseGrad.addColorStop(1, '#0f1117');

    ctx.fillStyle = baseGrad;
    ctx.beginPath();
    ctx.arc(0, 0, 20, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#636c82';
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.fillStyle = '#a0a8ba';
    for (let i = 0; i < 4; i++) {
      const rAng = (Math.PI / 2) * i + Math.PI / 4;
      const rx = Math.cos(rAng) * 14;
      const ry = Math.sin(rAng) * 14;
      ctx.beginPath();
      ctx.arc(rx, ry, 2, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.fillStyle = '#181a24';
    ctx.beginPath();
    ctx.arc(0, 0, 6, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#808a9e';
    ctx.beginPath();
    ctx.arc(-1, -1, 2.5, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  }

  function drawTrajectoryPreview() {
    const dx = CANNON.x - mouse.x, dy = CANNON.y - mouse.y;
    const len = clamp(vlen(dx, dy), 0, MAX_DRAG);
    const dlen = vlen(dx, dy) || 1;
    const vx = (dx / dlen) * len * LAUNCH_MULT;
    const vy = (dy / dlen) * len * LAUNCH_MULT;

    ctx.strokeStyle = 'rgba(255,255,255,0.45)';
    ctx.lineWidth = 2;
    ctx.setLineDash([6, 8]);
    let simX = CANNON.x, simY = CANNON.y, simVx = vx, simVy = vy;
    const dt = 0.05;
    ctx.beginPath();
    ctx.moveTo(simX, simY);
    for (let i = 0; i < 60; i++) {
      simVy += GRAVITY * dt;
      simX += simVx * dt;
      simY += simVy * dt;
      ctx.lineTo(simX, simY);
      if (simY > H || simX > W) break;
    }
    ctx.stroke();
    ctx.setLineDash([]);

    ctx.strokeStyle = 'rgba(255,205,60,0.85)';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(CANNON.x, CANNON.y);
    ctx.lineTo(mouse.x, mouse.y);
    ctx.stroke();
  }

  function render() {
    ctx.clearRect(0, 0, W, H);
    drawGrid();
    for (const t of targets) drawTarget(t);
    for (const b of balls) drawBall(b);
    for (const p of particles) drawParticle(p);
    drawCannon();
    if (dragging) drawTrajectoryPreview();

    document.getElementById('score').textContent = score;
    document.getElementById('ballCount').textContent = `${balls.length}/${MAX_BALLS}`;
    const targetsLeft = targets.filter(t => t.alive).length;
    document.getElementById('targetCount').textContent = targetsLeft;
    document.getElementById('winBanner').classList.toggle('show', targetsLeft === 0);
    document.getElementById('pauseOverlay').classList.toggle('show', paused);
  }

  function loop(now) {
    const dtFrame = Math.min((now - lastTime) / 1000, 0.033);
    lastTime = now;

    if (!paused) {
      const dt = dtFrame / SUBSTEPS;
      for (let s = 0; s < SUBSTEPS; s++) stepPhysics(dt);
      updateParticles(dtFrame);
    }
    render();
    requestAnimationFrame(loop);
  }

  function getPos(evt) {
    const rect = canvas.getBoundingClientRect();
    const clientX = evt.touches ? evt.touches[0].clientX : evt.clientX;
    const clientY = evt.touches ? evt.touches[0].clientY : evt.clientY;

    const scaleX = W / rect.width;
    const scaleY = H / rect.height;

    return {
      x: clamp((clientX - rect.left) * scaleX, 0, W),
      y: clamp((clientY - rect.top) * scaleY, 0, H)
    };
  }

  function onStart(e) {
    const targetsLeft = targets.filter(t => t.alive).length;
    if (targetsLeft === 0) {
      resetGame();
      return;
    }
    dragging = true;
    mouse = getPos(e);
  }

  function onMove(e) {
    if (dragging) {
      mouse = getPos(e);
    }
  }

  function onEnd(e) {
    if (dragging) {
      launchBall(mouse);
      dragging = false;
    }
  }

  canvas.addEventListener('mousedown', onStart);
  window.addEventListener('mousemove', onMove);
  window.addEventListener('mouseup', onEnd);

  canvas.addEventListener('touchstart', e => { onStart(e); e.preventDefault(); }, { passive: false });
  window.addEventListener('touchmove', e => { onMove(e); }, { passive: false });
  window.addEventListener('touchend', e => { onEnd(e); });

  function launchBall(pos) {
    if (balls.length >= MAX_BALLS) return;
    const dx = CANNON.x - pos.x, dy = CANNON.y - pos.y;
    const dist = vlen(dx, dy);
    const len = clamp(dist, 0, MAX_DRAG);
    if (len < 8) return;
    const vx = (dx / dist) * len * LAUNCH_MULT;
    const vy = (dy / dist) * len * LAUNCH_MULT;
    const radius = 12 + (len / MAX_DRAG) * 12;
    const hue = Math.floor(rand(0, 360));
    balls.push(makeBall(CANNON.x, CANNON.y, vx, vy, radius, hue));
  }

  window.addEventListener('keydown', e => {
    if (e.key === 'r' || e.key === 'R') resetGame();
    if (e.key === 'p' || e.key === 'P') paused = !paused;
  });

  resetTargets();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
